<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crypto Ajan Paneli</title>
<style>
  body {
    background: #0d1117;
    color: #c9d1d9;
    font-family: -apple-system, sans-serif;
    max-width: 700px;
    margin: 0 auto;
    padding: 16px;
  }
  h1 { font-size: 20px; }
  .updated { color: #8b949e; font-size: 13px; margin-bottom: 20px; }
  .card {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 16px; margin: 0 0 10px 0; }
  .fg-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 6px;
    font-weight: bold;
  }
  .news-item { font-size: 14px; padding: 6px 0; border-top: 1px solid #21262d; }
  .news-source-tag { color: #8b949e; font-size: 12px; margin-right: 6px; }
  .source-item { font-size: 13px; padding: 5px 0; border-top: 1px solid #21262d; display: flex; justify-content: space-between; }
  .source-type { color: #8b949e; font-size: 12px; }
  .symbol-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
  .rsi-high { color: #f85149; font-weight: bold; }
  .rsi-normal { color: #3fb950; }
  table { width: 100%; font-size: 12px; margin-top: 8px; border-collapse: collapse; }
  td, th { padding: 4px; text-align: left; border-top: 1px solid #21262d; }
  .state-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 6px;
    font-weight: bold;
    font-size: 13px;
  }
  .reason-item { font-size: 13px; padding: 3px 0; color: #8b949e; }
  .news-updated { color: #8b949e; font-size: 12px; margin-bottom: 8px; }
</style>
</head>
<body>

<h1>📊 Crypto Ajan Paneli</h1>
<div class="updated" id="updated">Yukleniyor...</div>

<div class="card">
  <h2>🤖 Market Agent</h2>
  <div id="market-agent">Yukleniyor...</div>
</div>

<div class="card">
  <h2>Fear &amp; Greed Index</h2>
  <div id="fear-greed">Yukleniyor...</div>
</div>

<div class="card">
  <h2>Guncel Haberler</h2>
  <div class="news-updated" id="news-updated"></div>
  <div id="news">Yukleniyor...</div>
</div>

<div class="card">
  <h2>Haber Kaynaklari</h2>
  <div id="news-sources">Yukleniyor...</div>
</div>

<div class="card">
  <h2>Semboller</h2>
  <div id="symbols">Yukleniyor...</div>
</div>

<div class="card">
  <h2>Market Agent Gecmisi (son 30)</h2>
  <div id="market-agent-history">Yukleniyor...</div>
</div>

<script>
const REPO = "mehazer/btc-alert";
const BRANCH = "main";
const SYMBOLS = ["BTCUSDT", "ETHUSDT", "SOLUSDT"];
const RSI_THRESHOLD = 70;

const STATE_COLORS = {
  NORMAL: "#3fb950",
  BULLISH: "#58a6ff",
  OVERHEATED: "#d29922",
  EXTREME_EUPHORIA: "#f85149",
};

function rawUrl(path) {
  const cacheBust = Date.now();
  return `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${path}?t=${cacheBust}`;
}

async function fetchJson(path) {
  const resp = await fetch(rawUrl(path));
  if (!resp.ok) throw new Error(`${path} yuklenemedi (${resp.status})`);
  return resp.json();
}

function fgColor(value) {
  if (value === null || value === undefined) return "#8b949e";
  if (value >= 75) return "#f85149";
  if (value >= 55) return "#d29922";
  if (value >= 45) return "#8b949e";
  return "#3fb950";
}

function stateColor(state) {
  return STATE_COLORS[state] || "#8b949e";
}

async function loadMarket() {
  try {
    const data = await fetchJson("history/market.json");
    document.getElementById("updated").textContent =
      "Son guncelleme: " + new Date(data.updated_at).toLocaleString("tr-TR");

    const fg = data.fear_greed_value;
    const label = data.fear_greed_label || "bilinmiyor";
    document.getElementById("fear-greed").innerHTML =
      `<span class="fg-badge" style="background:${fgColor(fg)}20;color:${fgColor(fg)}">
        ${fg ?? "?"} - ${label}
      </span>`;
  } catch (e) {
    document.getElementById("updated").textContent = "Piyasa verisi yuklenemedi: " + e.message;
  }
}

async function loadNews() {
  const newsEl = document.getElementById("news");
  const newsUpdatedEl = document.getElementById("news-updated");
  const sourcesEl = document.getElementById("news-sources");

  try {
    const data = await fetchJson("history/latest_news.json");

    newsUpdatedEl.textContent =
      "Son guncelleme: " + new Date(data.updated_at).toLocaleString("tr-TR");

    const headlines = data.headlines || [];
    newsEl.innerHTML = headlines.length
      ? headlines.map(h =>
          `<div class="news-item"><span class="news-source-tag">[${h.source}]</span>${h.headline}</div>`
        ).join("")
      : "Haber bulunamadi.";

    const sources = data.sources || [];
    sourcesEl.innerHTML = sources.length
      ? sources.map(s =>
          `<div class="source-item"><span>${s.name}</span><span class="source-type">${s.type}</span></div>`
        ).join("")
      : "Kaynak bilgisi yok.";
  } catch (e) {
    newsEl.textContent = "Haber verisi yuklenemedi: " + e.message;
    sourcesEl.textContent = "Kaynak listesi yuklenemedi.";
  }
}

async function loadSymbols() {
  const container = document.getElementById("symbols");
  container.innerHTML = "";

  for (const symbol of SYMBOLS) {
    try {
      const history = await fetchJson(`history/${symbol}.json`);
      const last = history[history.length - 1];
      const recent = history.slice(-5).reverse();

      const rsiClass = last.rsi >= RSI_THRESHOLD ? "rsi-high" : "rsi-normal";

      const rows = recent.map(r =>
        `<tr><td>${r.date}</td><td>${r.rsi}</td><td>${r.price}</td></tr>`
      ).join("");

      container.innerHTML += `
        <div class="symbol-row">
          <strong>${symbol}</strong>
          <span class="${rsiClass}">RSI ${last.rsi}</span>
          <span>${last.price}</span>
        </div>
        <table>
          <tr><th>Tarih</th><th>RSI</th><th>Fiyat</th></tr>
          ${rows}
        </table>
      `;
    } catch (e) {
      container.innerHTML += `<div class="symbol-row">${symbol}: veri yok</div>`;
    }
  }
}

async function loadMarketAgent() {
  const currentEl = document.getElementById("market-agent");
  const historyEl = document.getElementById("market-agent-history");

  try {
    const history = await fetchJson("history/market_agent_history.json");
    if (!history.length) {
      currentEl.textContent = "Henuz Market Agent kaydi yok.";
      historyEl.textContent = "Henuz Market Agent kaydi yok.";
      return;
    }

    const latest = history[history.length - 1];
    const color = stateColor(latest.state);
    const reasonsHtml = (latest.reasons || [])
      .map(r => `<div class="reason-item">• ${r}</div>`)
      .join("");

    currentEl.innerHTML = `
      <span class="state-badge" style="background:${color}20;color:${color}">
        ${latest.state}
      </span>
      <div style="margin-top:8px;font-size:14px;">
        Risk Skoru: <strong>${latest.risk_score}/100</strong> &nbsp;|&nbsp;
        Guven: <strong>${latest.confidence}%</strong>
      </div>
      <div style="margin-top:6px;">${reasonsHtml}</div>
    `;

    const last30 = history.slice(-30).reverse();
    const rows = last30.map(r => {
      const t = new Date(r.timestamp).toLocaleString("tr-TR");
      const c = stateColor(r.state);
      return `<tr>
        <td>${t}</td>
        <td style="color:${c}">${r.state}</td>
        <td>${r.risk_score}</td>
      </tr>`;
    }).join("");

    historyEl.innerHTML = `
      <table>
        <tr><th>Zaman</th><th>Durum</th><th>Skor</th></tr>
        ${rows}
      </table>
    `;
  } catch (e) {
    currentEl.textContent = "Market Agent verisi yuklenemedi: " + e.message;
    historyEl.textContent = "Market Agent gecmisi yuklenemedi.";
  }
}

loadMarket();
loadNews();
loadSymbols();
loadMarketAgent();
</script>

</body>
</html>
