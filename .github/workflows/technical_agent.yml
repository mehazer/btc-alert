name: Multi-Coin Daily RSI Alert

on:
  schedule:
    # Every 4 hours for 4h timeframe analysis.
    - cron: "0 */4 * * *"
  workflow_dispatch: {}   # Actions sekmesinden manuel de tetikleyebilirsin

# History dosyalarini (history/*.json) repo'ya geri commit edebilmek icin
# yazma izni gerekiyor. Bu izin SADECE bu repo icin, SADECE GitHub'in
# kendi otomatik ureteceoi GITHUB_TOKEN icindir - hicbir kisisel
# token/sifre kullanilmaz.
permissions:
  contents: write

concurrency:
  group: crypto-history-writers
  cancel-in-progress: false

jobs:
  check-rsi:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: Botu calistir
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYMBOLS: "BTCUSDT,ETHUSDT,SOLUSDT,ZECUSDT,ZAMAUSDT"
          INTERVAL: "4h"
          RSI_PERIOD: "14"
          RSI_THRESHOLD: "70"
          ALWAYS_NOTIFY: "true"
          NOTIFY_ALL_SYMBOLS: "true"

        run: python alert_bot.py

      - name: Tarihceyi (history/) repo'ya kaydet
        if: always()   # bot hata ile bitse bile o ana kadar toplanan history kaydedilsin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/
          if git diff --cached --quiet; then
            echo "History'de degisiklik yok, commit atlanildi."
          else
            git commit -m "RSI history guncelle [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
              echo "History push retry $attempt/3"
              sleep $((attempt * 5))
            done
            echo "History push failed after 3 attempts"
            exit 1
          fi
