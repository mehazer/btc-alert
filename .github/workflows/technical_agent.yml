name: Multi-Coin Daily RSI Alert

on:
  # Scheduled runs are handled by pipeline.yml (news → technical → v2).
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: crypto-history-writers
  cancel-in-progress: false

jobs:
  check-rsi:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: Botu calistir
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SYMBOLS: "BTCUSDT,ETHUSDT,SOLUSDT,ZECUSDT,ZAMAUSDT"
          INTERVAL: "4h"
          RSI_PERIOD: "14"
          RSI_THRESHOLD: "70"
          ALWAYS_NOTIFY: "true"
          NOTIFY_ALL_SYMBOLS: "true"
        run: python alert_bot.py

      - name: Tarihceyi (history/) repo'ya kaydet
        if: always()
        run: |
          bash scripts/persist-generated-data.sh "RSI history update [skip ci]" history/
