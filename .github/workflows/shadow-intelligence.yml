name: Intelligence v2 Shadow

on:
  # Scheduled runs are handled by pipeline.yml (news → technical → v2).
  workflow_dispatch:
    inputs:
      timeframe:
        description: "Analysis timeframe"
        required: false
        default: "4h"
      symbols:
        description: "Comma-separated symbols"
        required: false
        default: "BTCUSDT,ETHUSDT,SOLUSDT,ZECUSDT,ZAMAUSDT"

permissions:
  contents: write

jobs:
  shadow-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout legacy baseline
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run v2 shadow analysis with persistent ledger
        env:
          PYTHONPATH: .
        run: |
          TF="${{ github.event.inputs.timeframe }}"
          SYMS="${{ github.event.inputs.symbols }}"
          TF="${TF:-4h}"
          SYMS="${SYMS:-BTCUSDT,ETHUSDT,SOLUSDT,ZECUSDT,ZAMAUSDT}"
          python -m intelligence_v2.shadow_runner \
            --timeframe "$TF" \
            --symbols "$SYMS" \
            --output shadow_artifacts/latest.json

      - name: Run forecast walk-forward backtest
        env:
          PYTHONPATH: .
        run: |
          python -m intelligence_v2.walkforward \
            --history-dir history \
            --symbols BTCUSDT,ETHUSDT,SOLUSDT \
            --timeframe 4h || echo "Walk-forward completed with warnings"

      - name: Upload isolated shadow artifact
        uses: actions/upload-artifact@v4
        with:
          name: intelligence-v2-shadow-${{ github.run_id }}
          path: |
            shadow_artifacts/latest.json
            history/intelligence_v2/
          if-no-files-found: error

      - name: Persist v2 ledger to repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history/intelligence_v2/
          if git diff --cached --quiet; then
            echo "No v2 ledger changes to commit."
          else
            git commit -m "v2 ledger update [skip ci]"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort || true
              sleep $((attempt * 5))
            done
            exit 1
          fi
