name: News Agent

on:
  # Scheduled runs are handled by pipeline.yml (news → technical → v2).
  # Keep manual dispatch for debugging.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: crypto-history-writers
  cancel-in-progress: false

jobs:
  check-news:
    runs-on: ubuntu-latest
    steps:
      - name: Repo'yu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: Botu calistir
        env:
          NEWS_AI_API_KEY: ${{ secrets.NEWS_AI_API_KEY }}
          NEWS_AI_BASE_URL: ${{ secrets.NEWS_AI_BASE_URL }}
          NEWS_AI_MODEL: ${{ secrets.NEWS_AI_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python news_bot.py

      - name: Tarihceyi (history/) repo'ya kaydet
        if: always()
        run: |
          bash scripts/persist-generated-data.sh "News history update [skip ci]" history/
